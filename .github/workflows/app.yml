name: app

on:
  push:
    paths:
      - "apps/**"
      - "packages/shared/**"
      - "packages/risk/**"
      - "package.json"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/shared/**"
      - "packages/risk/**"
      - "package.json"
      - ".github/workflows/app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm --workspace @eaw/web run build
